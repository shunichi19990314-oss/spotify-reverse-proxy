<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Reverse Proxy — iframe 表示デモ</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #0b0b0b;
        color: #eaeaea;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        background: #181818;
        border-bottom: 1px solid #282828;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; color: #1ed760; white-space: nowrap; }
      input[type="text"] {
        flex: 1 1 260px;
        min-width: 180px;
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: #fff;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 13px;
        outline: none;
      }
      input[type="text"]:focus { border-color: #1ed760; }
      button {
        background: #1ed760;
        color: #000;
        border: 0;
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      button.secondary { background: #2a2a2a; color: #eaeaea; border: 1px solid #3a3a3a; }
      button:hover { filter: brightness(1.1); }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        background: #242424;
        border: 1px solid #333;
        color: #b3b3b3;
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      .chip:hover { color: #fff; border-color: #1ed760; }
      #frame { width: 100%; height: calc(100vh - 104px); border: 0; display: block; background: #121212; }
      #status { font-size: 12px; color: #777; padding: 0 14px 6px; background: #181818; }
      #status code { background: #242424; padding: 1px 6px; border-radius: 4px; color: #1ed760; }
      #frame { height: calc(100vh - 124px); }
      a { color: #1ed760; }
    </style>
  </head>
  <body>
    <header>
      <h1>▶ SPX demo</h1>
      <input id="path" type="text" value="/" spellcheck="false" />
      <button id="go">表示</button>
      <button id="pop" class="secondary">別タブ</button>
      <div class="chips">
        <span class="chip" data-path="/">ホーム</span>
        <span class="chip" data-path="/search">検索</span>
        <span class="chip" data-path="/collection/tracks">ライブラリ</span>
        <span class="chip" data-path="/playlist/37i9dQZEVXcJZyENOWUFo7">Today's Top Hits</span>
        <span class="chip" data-path="/genre/charts">チャート</span>
      </div>
    </header>
    <div id="status">読み込み中…</div>
    <iframe id="frame" src="/" allow="encrypted-media; autoplay; clipboard-write; fullscreen"></iframe>

    <script>
      var input = document.getElementById("path");
      var frame = document.getElementById("frame");
      var status = document.getElementById("status");

      function normalize(v) {
        v = String(v || "").trim();
        if (!v) return "/";
        // 完全な Spotify URL が貼られたらこのプロキシのパスに付け替える
        var m = /^https?:\/\/open\.spotify\.com(\/[^?]*)?(\?.*)?$/i.exec(v);
        if (m) return (m[1] || "/") + (m[2] || "");
        var m2 = /^https?:\/\/([^/]+)(\/.*)?$/i.exec(v);
        if (m2) return "/__h/" + m2[1] + (m2[2] || "/");
        if (v.charAt(0) !== "/") v = "/" + v;
        return v;
      }

      function go() {
        var p = normalize(input.value);
        input.value = p;
        frame.src = p;
        status.textContent = "読み込み中: " + p;
      }

      document.getElementById("go").addEventListener("click", go);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") go();
      });
      document.getElementById("pop").addEventListener("click", function () {
        window.open(normalize(input.value), "_blank", "noopener");
      });
      document.querySelectorAll(".chip").forEach(function (el) {
        el.addEventListener("click", function () {
          input.value = el.getAttribute("data-path");
          go();
        });
      });

      frame.addEventListener("load", function () {
        status.innerHTML =
          "表示中: <code>" + escapeHtml(input.value) + "</code> &nbsp;·&nbsp; " +
          '<a href="/__spx/info" target="_blank">info</a> · ' +
          '<a href="/__spx/stats" target="_blank">stats</a> &nbsp;·&nbsp; ' +
          "iframe が真っ白になる場合は ALLOW_EMBED / FRAME_ANCESTORS を確認してください";
      });

      function escapeHtml(v) {
        return String(v).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      frame.addEventListener("error", function () {
        status.textContent = "iframe の読み込みに失敗しました";
      });
    </script>
  </body>
</html>
